[["p","हड़प्पा संस्कृति की सबसे बड़ी पहचान उसकी सुनियोजित नगर-निर्माण कला थी। उस समय दुनिया भर में कहीं भी ऐसी नागरिक स्वच्छता और इंजीनियरिंग व्यवस्था देखने को नहीं मिलती थी।"],["h","1. ग्रिड पद्धति (Grid Pattern)"],["p","नगर शतरंज के बोर्ड की तरह बसे थे। सड़कें बिल्कुल सीधी थीं और एक-दूसरे को <b>90 डिग्री (समकोण)</b> पर काटती थीं।"],["l",["हवा चलने पर मुख्य चौराहों की धूल अपने आप उड़कर गलियों से बाहर चली जाती थी।","अधिकांश शहर दो भागों में बंटे थे:","<b>दुर्ग या गढ़ी (Citadel):</b> पश्चिम दिशा में ऊँचे चबूतरे पर; प्रशासनिक इमारतें और शासक वर्ग।","<b>निचला नगर (Lower Town):</b> पूर्व दिशा में बड़ा मैदानी इलाका; आम नागरिक, शिल्पी और व्यापारी।","<i>अपवाद: गुजरात का <b>धोलावीरा</b> तीन भागों (दुर्ग, मध्यम नगर, निचला नगर) में विभाजित था।</i>"]],["h","2. बेजोड़ जल-निकासी व्यवस्था"],["p","हड़प्पावासियों की जल-निकासी आज के कई आधुनिक कस्बों से भी बेहतर थी:"],["l",["हर घर के स्नानघर और रसोई का गंदा पानी दीवार के रास्ते बाहर निकलता था।","पानी गली की पक्की नाली में गिरता, जो शहर के मुख्य भूमिगत नाले से जुड़ जाती थी।","नालियाँ पकी ईंटों और चूने-जिप्सम से पूरी तरह ढकी रहती थीं।","नियमित सफाई के लिए निश्चित दूरी पर ढक्कन (Manholes) लगे थे।"]],["h","3. भवनों की बनावट"],["l",["धूप में सुखाई ईंटों के बजाय <b>भट्टी में पकी ईंटों</b> का व्यापक उपयोग; अनुपात हमेशा <b>4:2:1</b> (लंबाई : चौड़ाई : मोटाई)।","मकान एक या दो मंजिला, बीच में खुला आँगन और चारों ओर हवादार कमरे।","मुख्य दरवाजे चौड़ी सड़क पर नहीं, <b>पीछे की शांत गलियों में</b> खुलते थे। <i>(लोथल अपवाद: दरवाजे मुख्य सड़क पर)।</i>"]],["h","4. दो प्रमुख विशाल संरचनाएं"],["l",["<b>विशाल स्नानागार (मोहनजोदड़ो):</b> ईंटों का बड़ा पक्का जलकुंड, उत्तर और दक्षिण में सीढ़ियाँ। रिसाव रोकने के लिए जोड़ों पर <b>प्राकृतिक बिटुमेन (डामर)</b> का लेप। धार्मिक अनुष्ठानों पर सामूहिक स्नान के लिए।","<b>विशाल अन्नागार:</b> हड़प्पा और मोहनजोदड़ो दोनों जगह अनाज के विशाल गोदाम; नमी से बचाने के लिए विशेष वेंटिलेशन।"]]],
